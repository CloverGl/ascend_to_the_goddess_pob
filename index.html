<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ascend to the Goddess — калькулятор билдов</title>
<style>
  :root { --bg:#07070f; --panel:rgba(16,14,30,.94); --line:#8e78d8; --ink:#e8e4ff; --dim:#9a94b8; --gold:#ffd77a; --cyan:#60d8ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #sky { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  #sky.drag { cursor:grabbing; }
  header { position:fixed; left:0; right:0; top:0; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
           background:linear-gradient(#07070fee,#07070f00); pointer-events:none; z-index:5; }
  header > * { pointer-events:auto; }
  h1 { font-size:15px; margin:0 8px 0 2px; color:var(--gold); letter-spacing:.5px; text-shadow:0 0 12px #ffb84a88; white-space:nowrap; }
  select, input, button { font:inherit; color:var(--ink); background:#1a1630; border:1px solid #4a3e7a; border-radius:7px; padding:5px 8px; }
  button { cursor:pointer; background:linear-gradient(#2c2450,#1c1738); transition:box-shadow .2s, border-color .2s; }
  button:hover { border-color:var(--line); box-shadow:0 0 10px #8e78d866; }
  button.on { border-color:var(--gold); box-shadow:0 0 12px #ffd77a55; color:var(--gold); }
  #search { width:150px; }
  .tabs { display:flex; gap:4px; }
  #side { position:fixed; right:10px; top:94px; bottom:calc(10px + env(safe-area-inset-bottom)); width:min(360px, calc(100% - 20px)); background:var(--panel);
          border:1px solid var(--line); border-radius:12px; box-shadow:0 0 24px #8e78d833, inset 0 0 30px #8e78d811; overflow:auto; padding:12px 14px; z-index:4;
          transform:translateX(0); transition:transform .25s ease, opacity .25s; }
  #side.hide { transform:translateX(110%); opacity:0; pointer-events:none; }
  #side h2 { font-size:15px; margin:4px 0 8px; color:#c8b4ff; }
  #side h3 { font-size:12px; margin:12px 0 4px; color:var(--cyan); text-transform:uppercase; letter-spacing:1px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:2px 0; border-bottom:1px dashed #2a2448; }
  .row b { color:var(--gold); font-weight:600; white-space:nowrap; }
  .muted { color:var(--dim); }
  .item { border:1px solid #3a3260; border-radius:8px; padding:6px 8px; margin:6px 0; background:#120f22; }
  .item .nm { font-weight:600; }
  .r-normal{color:#c8c8c8}.r-magic{color:#8888ff}.r-rare{color:#ffff77}.r-legendary{color:#b04dff}.r-unique{color:#e0803a}
  .gem { display:flex; gap:6px; align-items:center; margin:4px 0; } .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #tip { position:fixed; pointer-events:none; z-index:9; max-width:300px; background:rgba(10,8,22,.97); border:1px solid var(--line); border-radius:10px;
         padding:8px 10px; box-shadow:0 0 18px #8e78d855; display:none; font-size:12px; }
  #tip .t { font-weight:700; margin-bottom:3px; } #tip .m { color:#9fd0ff; } #tip .d { color:var(--dim); font-style:italic; margin-top:3px; white-space:pre-line; }
  #tip .c { color:var(--gold); margin-top:4px; }
  #modal { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #modal .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; width:min(520px,100%); box-shadow:0 0 30px #8e78d855; max-height:90vh; overflow:auto; }
  #modal textarea { width:100%; height:120px; background:#0d0b1a; color:#9fd0ff; border:1px solid #3a3260; border-radius:8px; padding:8px; font:12px monospace; }
  .opt { display:block; width:100%; text-align:left; margin:5px 0; }
  .opt small { color:#9fd0ff; display:block; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#1c1738; border:1px solid var(--gold);
           color:var(--gold); padding:8px 14px; border-radius:10px; display:none; z-index:11; box-shadow:0 0 16px #ffd77a55; }
  #pts { color:var(--gold); white-space:nowrap; }
  @media (max-width:700px) { #side { top:auto; height:46vh; } #search { width:110px; } h1 { display:none; } }
</style>
</head>

<canvas id="sky"></canvas>
<header>

    <button data-tab="gems">Гемы</button>

</header>

bloodlust",0,1],["bleed_chance",0,0.15]]},{"i":"bm_gore","x":-648,"y":2546,"t":"k","n":"Рваные раны","l":["bm_s_gore"],"d":"Твоё кровотечение на враге стакается до 4 раз, каждое наносит 70% урона.","a":"bannerman","m":[["bm_gore",0,1]]},{"i":"bm_spray","x":-708,"y":2470,"t":"k","n":"Добивание","l":["bm_s_spray"],"d":"Враг с кровотечением, у которого после твоего удара остаётся меньше 15% здоровья, умирает. По истекающим кровью боссам вместо этого +30% урона.","a":"bannerman","m":[["bm_spray",0,1]]},{"i":"bm_crowd","x":-709,"y":2572,"t":"k","n":"Вызов на бой","l":["bm_s_crowd","bm_s_champion"],"d":"Первый редкий или уникальный враг, которого ты ударишь, становится Соперником: от него получаешь на 20% меньше урона, удары по нему дают вдвое больше Доблести, а его смерть от твоей руки заполняет Доблесть до максимума.","a":"bannerman","m":[["bm_crowd",0,1]]},{"i":"bm_champion","x":-644,"y":2643,"t":"k","n":"Овация","l":["bm_s_champion"],"d":"10 убийств за 8 с вызывают Овацию: 5 с +25% урона и +15% к скорости атаки. Вокруг встают призрачные трибуны.","a":"bannerman","m":[["bm_champion",0,1]]},{"i":"bm_living","x":-794,"y":2692,"t":"k","n":"Живое знамя","l":["bm_s_living"],"d":"Воткнутое знамя ходит за тобой и не исчезает. Его аура на 25% слабее и зависит от Доблести, которая у тебя сейчас. Доблесть при установке не тратится, но тает — 1 за 2 с.","a":"bannerman","m":[["bm_living",0,1]]},{"i":"bm_field","x":-741,"y":2674,"t":"k","n":"Поле битвы","l":["bm_s_field"],"d":"Можно держать воткнутыми все три знамени сразу, но Доблесть копится вдвое медленнее.","a":"bannerman","m":[["bm_field",0,1]]},{"i":"bannerman_start","x":-795.3,"y":2601.1,"t":"n","n":"Гладиатор","l":["bm_s_bearer","bm_s_keep","bm_s_wall","bm_s_bloodlust","bm_s_crowd","bm_s_living","bm_s_field"],"d":"Удары копят Доблесть (до 50). Скилл знамени: 1-е нажатие — поднять знамя (слабая аура вокруг тебя), 2-е — воткнуть его, потратив Доблесть (аура сильнее и дольше), 3-е — снять. Ты получаешь Военное знамя.","a":"ban 'use strict';
const $ = s => document.querySelector(s);
const CLS_COL = {warrior:'#d8743a', archer:'#4ce6a0', mage:'#6ea0ff', rogue:'#c83040', illusionist:'#a0e8ff', hunter:'#8ce04a', edgerunner:'#ffe14a', fisher:'#50c8dc', gambler:'#b070ff'};
const SECRET = {edgerunner:['er_','erc_'], fisher:['fs_','fsc_'], gambler:['gb_','gbc_']};
const GATE = {edgerunner:'er_gate', fisher:'fs_gate', gambler:'gb_gate'};
const MAIN_KEYSTONES = 4, MAX_POINTS = 128;   // all the points of the main tree: levels, acts, books
let D, N = {}, ADJ = {}, ASC = {}, PCT;
const S = { cls:'warrior', asc:'', alloc:new Set(), mast:{}, level:90, extra:null, tab:'calc', query:'' };
let view = { x:0, y:0, z:0.18 }, hover = null, path = [];

// ---------------- data ----------------
// the tree data is inlined (tools/build_calculator.py): the page works from any host, and opened as a plain file too
addEventListener('DOMContentLoaded', () => { try { const el = document.getElementById('tree-data'); D = JSON.parse(el.textContent); init(); }
catch (e) { console.error(e); document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:40%;width:100%;text-align:center">Не удалось загрузить данные дерева: ' + e.message + '</p>'); } });

function init() {
  PCT = new Set(D.percent);
  for (const n of D.nodes) { N[n.i] = n; ADJ[n.i] = ADJ[n.i] || new Set(); }
  for (const n of D.nodes) for (const l of n.l) { if (!N[l]) continue; ADJ[n.i].add(l); ADJ[l].add(n.i); }
  for (const a of D.ascendancies) ASC[a.i] = a;
  const cs = $('#cls');
  for (const [k, v] of Object.entries(D.classes)) cs.insertAdjacentHTML('beforeend', `<option value="${k}">${v}</option>`);
  cs.onchange = () => { S.cls = cs.value; S.asc = ''; S.alloc.clear(); S.mast = {}; fillAsc(); centre(); redraw(); };
  $('#asc').onchange = () => { S.asc = $('#asc').value; [...S.alloc].forEach(id => { if (N[id].a) S.alloc.delete(id); }); prune(); redraw(); };

// ---------------- rules (tree/SkillTree, the same as in the game) ----------------
const secretOwner = id => { for (const [c, ps] of Object.entries(SECRET)) for (const p of ps) if (id.startsWith(p)) return c; return null; };

  const o = secretOwner(n.i); if (o && o !== S.cls) return false;
  return true;
}
function openStart(n) {

  if (n.a) return n.a === S.asc;
  if (n.c === S.cls) return true;
  const g = GATE[S.cls];
  return !!(g && S.alloc.has(g) && !SECRET[n.c]);
}
const keystones = asc => [...S.alloc].filter(id => N[id].t === 'k' && (N[id].a || '') === asc).length;
function canTake(n) {
  if (n.st || S.alloc.has(n.i) || !visible(n)) return false;
  if (n.a && n.a !== S.asc) return false;
  if (n.t === 'k' && keystones(n.a || '') >= (n.a ? (ASC[n.a] || {}).k || 4 : MAIN_KEYSTONES)) return false;
  for (const id of S.alloc) { const o = N[id]; if ((n.ex || []).includes(id) || (o.ex || []).includes(n.i)) return false; }
  for (const nb of ADJ[n.i]) { const o = N[nb]; if (S.alloc.has(nb) || openStart(o)) return true; }

}

  if (canTake(goal)) return [id];

  for (const n of D.nodes) if (S.alloc.has(n.i) || openStart(n)) { from.set(n.i, n.i); q.push(n.i); }
  while (q.length) {
    const c = q.shift();

      const o = N[nb];
      if (o.st || !visible(o) || (o.a && o.a !== S.asc)) continue;
      from.set(nb, c);
      if (nb === id) { const p = []; for (let x = nb; !S.alloc.has(x) && !N[x].st; x = from.get(x)) { p.unshift(x); if (from.get(x) === x) break; } return p; }

    while (q.length) { const c = q.shift(); for (const nb of ADJ[c]) if (!seen.has(nb) && S.alloc.has(nb)) { seen.add(nb); q.push(nb); } }
    let gone = 0;
    for (const id of [...S.alloc]) if (!seen.has(id)) { S.alloc.delete(id); delete S.mast[id]; gone++; }
    if (!gone) break;

}

// ---------------- stats ----------------
function collect(extraNodes) {   // every modifier: tree, masteries, gear, jewels

    const n = N[id]; if (!n) continue;
    (n.m || []).forEach(m => add(m, 'tree'));
    if (n.mo && S.mast[id]) { const o = n.mo.find(o => o.i === S.mast[id]); if (o) o.m.forEach(m => add(m, 'tree')); }

    for (const it of gear) for (const k of ['implicits', 'prefixes', 'suffixes']) for (const s of it[k] || []) {
      if (s.stat.includes('local/')) continue;   // a weapon's own numbers stay on the weapon

}
const GROUPS = [

}

  o.nodes = [...S.alloc].sort().map(i => 'passivetree:' + i);
  o.masteries = Object.fromEntries(Object.entries(S.mast).map(([k, v]) => ['passivetree:' + k, v]));

}
function load(o) {

  S.alloc = new Set((o.nodes || []).map(i => i.split(':').pop()).filter(i => N[i]));
  S.mast = Object.fromEntries(Object.entries(o.masteries || {}).map(([k, v]) => [k.split(':').pop(), v]));

}

$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').style.display = 'none'; };

// ---------------- the sky ----------------
const cv = $('#sky'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = [];
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({length: 260}, () => [Math.random() * W, Math.random() * H, Math.random() * 1.4 + .2, Math.random() * 6]);
  draw();
}
addEventListener('resize', resize);
const sx = n => W / 2 + (n.x - view.x) * view.z, sy = n => H / 2 + (n.y - view.y) * view.z;
function centre() {

  view.z = innerWidth < 700 ? 0.12 : 0.18;
}
function size(n) { return (n.st ? 13 : n.t === 'k' ? 12 : n.t === 'n' ? 8.5 : n.mo ? 9 : n.so ? 8 : 4.6) * Math.max(0.55, Math.min(2.2, view.z * 4.5)); }

  const used = [...S.alloc].filter(id => !N[id].a).length; $('#pts').textContent = `${used} / ${MAX_POINTS} очк.`; $('#pts').style.color = used > MAX_POINTS ? '#ff7a7a' : ''; }
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(ts) {

  const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, '#16123088'); g.addColorStop(1, '#07070f00'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const [x, y, r, p] of stars) { cx.globalAlpha = .35 + .3 * Math.sin(t * .8 + p); cx.fillStyle = '#cfd8ff'; cx.fillRect(x, y, r, r); }
  cx.globalAlpha = 1;
  const col = colour(), pathSet = new Set(path);
  // links
  cx.lineCap = 'round';
  for (const n of D.nodes) {
    if (!visible(n)) continue;
    for (const l of ADJ[n.i]) {
      if (l < n.i) continue; const m = N[l]; if (!visible(m)) continue;
      const x1 = sx(n), y1 = sy(n), x2 = sx(m), y2 = sy(m);
      if (Math.max(x1, x2) < -20 || Math.min(x1, x2) > W + 20 || Math.max(y1, y2) < -20 || Math.min(y1, y2) > H + 20) continue;
      const on = (S.alloc.has(n.i) || n.st && openStart(n)) && (S.alloc.has(l) || m.st && openStart(m));
      const pth = (pathSet.has(n.i) || S.alloc.has(n.i) || openStart(n)) && (pathSet.has(l) || S.alloc.has(l) || openStart(m)) && (pathSet.has(n.i) || pathSet.has(l));
      cx.strokeStyle = on ? col : pth ? '#ffe070' : (n.a || m.a) ? '#3a3260' : '#2a2a48';
      cx.lineWidth = on ? 2.6 : pth ? 2.4 : 1;

    }

    if (!visible(n)) continue;
    const x = sx(n), y = sy(n), r = size(n);
    if (x < -r || x > W + r || y < -r || y > H + r) continue;
    const on = S.alloc.has(n.i) || n.st && openStart(n), can = !on && canTake(n), inPath = pathSet.has(n.i);
    if (q && (n.n || '').toLowerCase().includes(q)) { cx.fillStyle = `rgba(255,224,64,${.25 + .2 * Math.sin(t * 5)})`; cx.beginPath(); cx.arc(x, y, r * 2.4, 0, 7); cx.fill(); }
    if (on || inPath || n === hover) { cx.shadowColor = inPath ? '#ffd040' : col; cx.shadowBlur = n === hover ? 18 : 12; }
    const base = on ? col : inPath ? '#ffe070' : can ? '#8a86b8' : '#3c3a5a';
    cx.fillStyle = base; cx.strokeStyle = on ? '#fff6d0' : can ? '#c8c4ff' : '#55527a'; cx.lineWidth = n.t === 'k' ? 2.4 : 1.2;
    cx.beginPath();
    if (n.mo) { for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; cx[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } cx.closePath(); }

    if (n.t === 'n' && on) { cx.fillStyle = '#fff6d0'; cx.beginPath(); cx.arc(x, y, r * .35, 0, 7); cx.fill(); }
    if (n.st && view.z > .1) { cx.fillStyle = n.a ? '#c8b4ff' : (CLS_COL[n.c] || '#fff'); cx.font = `600 ${Math.max(10, 12 * view.z * 4)}px system-ui`; cx.textAlign = 'center';

function nodeAt(px, py) {
  let best = null, bd = 1e9;
  for (const n of D.nodes) { if (!visible(n)) continue; const d = Math.hypot(sx(n) - px, sy(n) - py), r = Math.max(10, size(n) + 4); if (d < r && d < bd) { bd = d; best = n; } }
  return best;
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, id:e.pointerId}; moved = 0; cv.classList.add('drag'); });
cv.addEventListener('pointermove', e => {
  if (pinch) return;
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.hypot(dx, dy));
    if (moved > 4) { view.x = drag.vx - dx / view.z; view.y = drag.vy - dy / view.z; hideTip(); draw(); return; }
  }
  if (e.pointerType === 'mouse') hoverAt(e.clientX, e.clientY);
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  if (drag && moved <= 4) tap(e.clientX, e.clientY, e.pointerType !== 'mouse');
  drag = null;
});
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, {passive:false});
cv.addEventListener('touchstart', e => { if (e.touches.length === 2) { drag = null; const [a, b] = e.touches; pinch = {d:Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z:view.z}; } }, {passive:true});
cv.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { const [a, b] = e.touches; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, pinch.z * d / pinch.d / view.z); } }, {passive:true});
cv.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
function zoomAt(px, py, k) {
  const wx = view.x + (px - W / 2) / view.z, wy = view.y + (py - H / 2) / view.z;
  view.z = Math.max(.04, Math.min(1.6, view.z * k));
  view.x = wx - (px - W / 2) / view.z; view.y = wy - (py - H / 2) / view.z; hideTip(); draw();
}
let tapped = null;
function tap(px, py, touch) {
  const n = nodeAt(px, py);
  if (!n) { hover = null; path = []; hideTip(); draw(); return; }
  if (touch && tapped !== n) { tapped = n; hoverAt(px, py); return; }   // on a phone: the first tap shows, the second takes
  tapped = null;
  if (S.alloc.has(n.i)) {
    if (n.mo) return mastery(n);
    S.alloc.delete(n.i); delete S.mast[n.i]; path = []; redraw(); hoverAt(px, py); return;
  }
  const p = pathTo(n.i);
  if (!p.length) { toast(n.a && n.a !== S.asc ? 'Сначала выберите это асценданси' : 'Сюда не дойти'); return; }
  p.forEach(id => S.alloc.add(id)); path = []; redraw();
  if (n.mo && !S.mast[n.i]) mastery(n); else hoverAt(px, py);
}
function mastery(n) {
  let h = `<h2 style="margin:0 0 8px;color:var(--gold)">${n.n}</h2><p class="muted">Выберите свойство мастери:</p>`;
  n.mo.forEach((o, k) => h += `<button class="opt ${S.mast[n.i] === o.i ? 'on' : ''}" data-k="${k}">${o.n || o.i}<small>${o.m.map(m => line(m[0], m[1], m[2]) + (m[3] ? ` за ${fmt(m[4])} ${name(m[3])}` : '')).join('<br>')}</small></button>`);
  h += `<button class="opt" data-k="-1" style="color:#ff9a9a">Убрать мастери</button>`;
  modal(h);
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (k < 0) { S.alloc.delete(n.i); delete S.mast[n.i]; } else S.mast[n.i] = n.mo[k].i;
    $('#modal').style.display = 'none'; redraw();
  });
}
function hoverAt(px, py) {
  const n = nodeAt(px, py);
  hover = n; path = n && !S.alloc.has(n.i) ? pathTo(n.i) : [];
  if (!n) { hideTip(); draw(); return; }
  let h = `<div class="t" style="color:${n.t === 'k' ? '#ff8a7a' : n.t === 'n' ? '#ffd77a' : '#fff'}">${n.n}</div>`;
  (n.m || []).forEach(m => { if (!(m[1] === 0 && m[2] === 1 && /^(hn_|jugg|unstop)/.test(m[0]))) h += `<div class="m">${line(m[0], m[1], m[2])}${m[3] ? ` за ${fmt(m[4])} ${name(m[3])}` : ''}</div>`; });
  if (n.mo) h += `<div class="m">${S.mast[n.i] ? 'Выбрано: ' + ((n.mo.find(o => o.i === S.mast[n.i]) || {}).n || '') : 'Мастери: ' + n.mo.length + ' на выбор'}</div>`;
  if (n.d) h += `<div class="d">${n.d}</div>`;
  if (path.length) {
    const before = totals(collect()), after = totals(collect(path));
    h += `<div class="c">Путь: ${path.length} очк. — ${matchMedia('(pointer:coarse)').matches ? 'нажмите ещё раз' : 'клик'}, чтобы взять</div>`;
    const diff = [];
    for (const [a, x] of Object.entries(after)) {
      const y = before[a] || {flat:0, inc:0, more:1};
      if (Math.abs(x.flat - y.flat) > 1e-9 && !['strength','dexterity','intelligence'].includes(a)) diff.push(line(a, 0, x.flat - y.flat));
      if (Math.abs(x.inc - y.inc) > 1e-9) diff.push(line(a, 1, x.inc - y.inc));
    }
    if (diff.length > (n.m || []).length) h += `<div class="muted" style="margin-top:3px">С путём: ${diff.slice(0, 6).join(', ')}${diff.length > 6 ? '…' : ''}</div>`;
  } else if (S.alloc.has(n.i)) h += `<div class="muted" style="margin-top:4px">${n.mo ? 'Клик — сменить мастери' : 'Клик — снять (и всё, что держится только на ней)'}</div>`;
  const tip = $('#tip'); tip.innerHTML = h; tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(W - tw - 8, px + 16) + 'px'; tip.style.top = Math.min(H - th - 8, py + 16) + 'px';
  draw();
}
function hideTip() { $('#tip').style.display = 'none'; }
</script>
</body>
</html>
